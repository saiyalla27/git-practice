name: Repository file check

on:
  workflow_dispatch:
  push:
    branches:
      - github-actions-file-check
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  repository-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check required files
        run: |
          test -f README.md
          test -f .gitignore
          echo "Required repository files are present."