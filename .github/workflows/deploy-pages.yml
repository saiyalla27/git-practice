name: Deploy GitHub Pages

on:
  push:
    branches:
      - github-pages-actions-deploy
      - github-pages-manual
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-site:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Check that both pages exist
        run: |
          test -f docs/index.html
          test -f docs/project-updates.html

  deploy:
    if: github.ref == 'refs/heads/github-pages-manual'
    needs: check-site
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site files
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published pages
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          site_url="${SITE_URL%/}"
          bash bash/service_health_check.sh "$site_url/"
          bash bash/service_health_check.sh "$site_url/project-updates.html"